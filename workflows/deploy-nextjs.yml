# GitHub Actions Workflow for Next.js Application
# Builds and runs via PM2 with .env file support
# Copy this file to your repository: .github/workflows/deploy.yml

name: Deploy Quizwall Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  # ============== CONFIGURE THESE ==============
  APP_BASE_DIR: /home/ubuntu/app-deploy    # Base directory for deployments
  PROJECT_NAME: ${{ github.event.repository.name }}  # Or set custom name
  # =============================================
  APP_DIR: /home/ubuntu/app-deploy/${{ github.event.repository.name }}
  NODE_ENV: production

jobs:
  deploy:
    name: Build and Deploy Next.js App
    runs-on: [self-hosted, ubuntu, ec2]

    steps:
      - name: Display deployment info
        run: |
          echo "🚀 Starting Next.js deployment..."
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Project: ${{ env.PROJECT_NAME }}"
          echo "Deploy Path: ${{ env.APP_DIR }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create app directory
        run: |
          mkdir -p ${{ env.APP_DIR }}

      - name: Sync files to app directory
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.next' \
            --exclude 'ecosystem.config.js' \
            --exclude 'ecosystem.config.cjs' \
            ./ ${{ env.APP_DIR }}/

      - name: Setup environment file
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Create .env.local for Next.js (preferred over .env)
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env.local
            echo "Environment file created from secrets"
          elif [ -f .env.example ]; then
            cp .env.example .env.local
            echo "Copied .env.example to .env.local (update with real values!)"
          fi
          
          # Also create .env for runtime vars
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Install all dependencies including devDependencies (needed for build)
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Next.js application
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "Building Next.js application..."
          npm run build
          
          # Verify build output
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next/ directory created"
          else
            echo "❌ Build failed - .next/ directory not found"
            exit 1
          fi

      - name: Deploy with PM2
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Determine ecosystem config file
          if [ -f ecosystem.config.cjs ]; then
            PM2_CONFIG="ecosystem.config.cjs"
          else
            PM2_CONFIG="ecosystem.config.js"
          fi
          
          # Stop and delete existing process
          pm2 delete ${{ env.PROJECT_NAME }} 2>/dev/null || true
          
          # Start application
          pm2 start $PM2_CONFIG --env production
          
          # Save PM2 process list
          pm2 save

      - name: Health check
        run: |
          echo "Waiting for Next.js to start..."
          sleep 10
          
          # Get process status using pm2 jlist
          PM2_DATA=$(pm2 jlist)
          echo "PM2 Process List:"
          echo "$PM2_DATA" | jq '.'
          
          STATUS=$(echo "$PM2_DATA" | jq -r '.[] | select(.name=="${{ env.PROJECT_NAME }}") | .pm2_env.status' 2>/dev/null || echo "")
          
          echo "Process status: '$STATUS'"
          
          if [ -z "$STATUS" ]; then
            echo "❌ Process '${{ env.PROJECT_NAME }}' not found in PM2"
            pm2 list
            exit 1
          elif [ "$STATUS" = "online" ]; then
            echo "✅ Application is running!"
            pm2 show ${{ env.PROJECT_NAME }}
            
            # Test HTTP response
            echo ""
            echo "Testing HTTP response..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3000 || true
          else
            echo "❌ Application status: $STATUS"
            echo "Showing recent logs:"
            pm2 logs ${{ env.PROJECT_NAME }} --lines 50 --nostream
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo ""
          echo "=============================================="
          echo "✅ Next.js Deployment Complete!"
          echo "=============================================="
          echo ""
          echo "📦 Project: ${{ env.PROJECT_NAME }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "📁 Path: ${{ env.APP_DIR }}"
          echo "🌐 URL: http://localhost:3000"
          echo ""
          pm2 list
          echo ""
          echo "💡 Configure Nginx to proxy requests to port 3000"

